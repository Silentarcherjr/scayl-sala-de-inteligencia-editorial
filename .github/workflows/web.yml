name: Web static
on:
  pull_request:
    paths: ['web/**', 'scripts/export_web.py', 'tests/test_export_web.py', '.github/workflows/web.yml']
  push:
    branches: [main, worker-web/next-static]
    paths: ['web/**', 'scripts/export_web.py', 'tests/test_export_web.py', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
